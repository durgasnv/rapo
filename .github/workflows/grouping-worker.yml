name: Scheduled grouping

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
    - cron: "17 * * * *"

permissions:
  contents: read

concurrency:
  group: production-grouping
  cancel-in-progress: false

jobs:
  grouping:
    # Public repositories have free standard runners. Private repos use included minutes.
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'workflow_dispatch' ||
      (vars.RAPO_SCHEDULE_ENABLED == 'true' &&
      ((github.event.schedule == '7,22,37,52 * * * *' && !github.event.repository.private) ||
      (github.event.schedule == '17 * * * *' && github.event.repository.private))))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff # v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --no-dev
      - name: Process a bounded batch of due events
        run: |
          test -n "$RAPO_DATABASE_URL"
          PYTHONPATH=apps/api uv run --no-sync python -m app.jobs.grouping --once --batch-size 100
        env:
          RAPO_DATABASE_URL: ${{ secrets.RAPO_DATABASE_URL }}
          RAPO_ENVIRONMENT: production
          RAPO_COOKIE_SECURE: "true"
          RAPO_RESET_FRONTEND_URL: ${{ vars.RAPO_FRONTEND_URL }}
          RAPO_CORS_ORIGINS: ${{ format('["{0}"]', vars.RAPO_FRONTEND_URL) }}
